name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    working-directory: DocExtractor-source

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller
      - name: Download OCR models
        run: python prefetch_models.py
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onedir --name DocExtractor --add-data "static;static" --add-data "models;models" --collect-all easyocr server.py
      - uses: actions/upload-artifact@v4
        with:
          name: DocExtractor-windows
          path: DocExtractor-source/dist/DocExtractor
